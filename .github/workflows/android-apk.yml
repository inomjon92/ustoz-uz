name: Android APK

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Sayt manzili (https://...)"
        required: true
        default: "https://ustoz-uz-beta.vercel.app"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: APK yig'ish
        working-directory: android
        # GitHub runner'larida Android SDK oldindan o'rnatilgan
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: gradle assembleRelease -PsiteUrl="${{ inputs.site_url }}"
      - name: APK'ni nomlash
        run: cp android/app/build/outputs/apk/release/*.apk ustoz-uz.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ustoz-uz-apk
          path: ustoz-uz.apk
      - name: Telefondan yuklab olish uchun Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${{ github.run_number }}"
          gh release create "$TAG" ustoz-uz.apk --latest \
            --title "Ustoz.uz Android ilovasi (${{ github.run_number }})" \
            --notes "Sayt: ${{ inputs.site_url }}. Telefonda ustoz-uz.apk faylini yuklab oling va o'rnating."
