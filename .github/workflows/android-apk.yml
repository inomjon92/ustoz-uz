name: Android APK

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Sayt manzili (https://...)"
        required: true
        default: "https://ustoz-uz.vercel.app"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: APK yig'ish
        working-directory: android
        # GitHub runner'larida Android SDK oldindan o'rnatilgan
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: gradle assembleRelease -PsiteUrl="${{ inputs.site_url }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ustoz-uz-apk
          path: android/app/build/outputs/apk/release/*.apk
